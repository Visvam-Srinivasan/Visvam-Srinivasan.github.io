<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f1e7" />
    <meta name="description" content="" />
    <title></title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/css/styles.css" />
    <script type="module" src="./assets/js/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content" data-copy="navigation.skip"></a>
    <header class="site-header">
      <a class="wordmark" href="#/home" aria-label="">
        <span class="wordmark-mark"></span>
        <span data-site="name"></span>
      </a>
      <nav class="navigation" id="primary-navigation" aria-label="">
        <a href="#/graph" data-route="graph"><span data-route-label></span></a>
        <a href="#/resume" data-route="resume"><span data-route-label></span></a>
        <a href="#/projects" data-route="projects"><span data-route-label></span></a>
        <a href="#/blog" data-route="blog"><span data-route-label></span></a>
        <a href="#/about" data-route="about"><span data-route-label></span></a>
        <a class="nav-contact" href="#/contact" data-route="contact">
          <span data-route-label></span> <span aria-hidden="true">↗</span>
        </a>
      </nav>
      <div class="header-controls">
        <button class="theme-toggle" type="button" aria-label="" title="">
          <span aria-hidden="true">☾</span>
        </button>
        <button
          class="menu-toggle"
          type="button"
          aria-label=""
          aria-expanded="false"
          aria-controls="primary-navigation"
        >
          <span></span><span></span>
        </button>
      </div>
    </header>

    <main id="main-content" tabindex="-1">
      <div id="app" aria-live="polite">
      </div>
    </main>

    <footer class="site-footer">
      <span>© <span id="current-year"></span> <span data-site="name"></span></span>
      <span></span>
      <a href="#/home"></a>
    </footer>
  </body>
</html>
